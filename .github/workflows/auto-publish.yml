name: "Autopilot SEO Article Publisher (Gemini 2.5 Flash)"

on:
  # Autopublicación pausada por solicitud del propietario (para evitar Scaled Content Abuse en dominio nuevo .vercel.app).
  # Solo se ejecutará manualmente si haces clic en "Run workflow" desde la pestaña Actions en GitHub.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate New SEO Troubleshooting Article via Gemini 2.5 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-article.mjs

      - name: Commit and Push New Article to Main Branch
        run: |
          git config user.name "QuickFixHub Autopilot Bot"
          git config user.email "actions@github.com"
          git add content/articles/*.md content/topics-queue.json
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "chore(content): auto-publish new US troubleshooting guide"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Notify Bing, DuckDuckGo & Yahoo via IndexNow
        run: |
          sleep 60
          node scripts/ping-indexnow.mjs
